  <text x="720" y="642" fill="#aaa" font-size="10" font-weight="bold">Priority</text>
  <text x="870" y="642" fill="#aaa" font-size="10" font-weight="bold">Due</text>
  <text x="315" y="670" fill="#ccc" font-size="11">Compressor-01</text>
