  <text x="870" y="695" fill="#ccc" font-size="11">3 days</text>
  <text x="315" y="720" fill="#ccc" font-size="11">Pump-02</text>
  <text x="500" y="720" fill="#ccc" font-size="11">Seal inspection required</text>
  <rect x="720" y="708" width="55" height="17" rx="3" fill="#FFC107" opacity="0.3"/>
  <text x="728" y="720" fill="#FFC107" font-size="10">Medium</text>
  <text x="870" y="720" fill="#ccc" font-size="11">7 days</text>

