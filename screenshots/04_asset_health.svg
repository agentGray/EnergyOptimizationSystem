<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#0e1117"/><stop offset="100%" style="stop-color:#1a1d24"/></linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#262730"/><stop offset="100%" style="stop-color:#1e1f2a"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg4)"/>
  <rect x="0" y="0" width="250" height="900" fill="#262730"/>
