  <text x="660" y="375" fill="#ccc" font-size="11">45</text>
  <text x="770" y="375" fill="#4CAF50" font-size="11">94%</text>
  <text x="870" y="375" fill="#ccc" font-size="11">95%</text>
  <text x="970" y="375" fill="#ccc" font-size="11">5 days ago</text>

  <text x="315" y="400" fill="#ccc" font-size="11">Furnace-01</text>
