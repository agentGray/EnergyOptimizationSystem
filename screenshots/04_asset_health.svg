  <text x="670" y="820" fill="#ccc" font-size="10">7 assets</text>
  <text x="320" y="842" fill="#ccc" font-size="10">80-89</text>
  <rect x="380" y="830" width="160" height="16" rx="3" fill="#FFC107"/>
  <text x="550" y="842" fill="#ccc" font-size="10">4 assets</text>
  <text x="320" y="864" fill="#ccc" font-size="10">&lt;80</text>
  <rect x="380" y="852" width="80" height="16" rx="3" fill="#f44336"/>
  <text x="470" y="864" fill="#ccc" font-size="10">3 assets</text>
