  <rect x="550" y="388" width="55" height="17" rx="3" fill="#4CAF50" opacity="0.2"/>
  <text x="556" y="400" fill="#4CAF50" font-size="10">Running</text>
  <text x="660" y="400" fill="#ccc" font-size="11">200</text>
  <text x="770" y="400" fill="#FFC107" font-size="11">85%</text>
  <text x="870" y="400" fill="#ccc" font-size="11">87%</text>
  <text x="970" y="400" fill="#ccc" font-size="11">20 days ago</text>

  <text x="315" y="425" fill="#ccc" font-size="11">Motor-05</text>
  <text x="440" y="425" fill="#ccc" font-size="11">Motor</text>
  <rect x="550" y="413" width="35" height="17" rx="3" fill="#FFC107" opacity="0.2"/>
  <text x="556" y="425" fill="#FFC107" font-size="10">Idle</text>
  <text x="660" y="425" fill="#ccc" font-size="11">0</text>
  <text x="770" y="425" fill="#4CAF50" font-size="11">96%</text>
  <text x="870" y="425" fill="#ccc" font-size="11">N/A</text>
  <text x="970" y="425" fill="#ccc" font-size="11">8 days ago</text>

  <text x="500" y="540" fill="#888" font-size="11">... showing 6 of 18 assets</text>

  <!-- Maintenance Schedule -->
