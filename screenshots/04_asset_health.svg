  <rect x="290" y="615" width="870" height="120" rx="8" fill="url(#card4)" stroke="#333" stroke-width="1"/>
  <rect x="300" y="625" width="850" height="25" rx="3" fill="#1a1d24"/>
  <text x="315" y="642" fill="#aaa" font-size="10" font-weight="bold">Asset</text>
