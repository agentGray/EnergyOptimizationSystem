<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1117"/>
      <stop offset="100%" style="stop-color:#1a1d24"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#262730"/>
      <stop offset="100%" style="stop-color:#1e1f2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg3)"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="900" fill="#262730"/>
  <text x="30" y="45" fill="#ffffff" font-size="20" font-weight="bold">⚡ Energy Platform</text>
  <line x1="15" y1="60" x2="235" y2="60" stroke="#444" stroke-width="1"/>
  <text x="30" y="120" fill="#ccc" font-size="14">🏠 Live Dashboard</text>
  <text x="30" y="150" fill="#ccc" font-size="14">🔍 Anomaly Detection</text>
  <rect x="15" y="163" width="220" height="32" rx="5" fill="#ff4b4b" opacity="0.2"/>
  <text x="30" y="184" fill="#ff4b4b" font-size="14">⚖️ Load Dispatch</text>
  <text x="30" y="218" fill="#ccc" font-size="14">🏭 Asset Health</text>
  <text x="30" y="248" fill="#ccc" font-size="14">🌱 ESG &amp; ISO 50001</text>

  <!-- Title -->
  <text x="290" y="50" fill="#ffffff" font-size="26" font-weight="bold">⚖️ Load Dispatch &amp; Optimization</text>
  <text x="290" y="78" fill="#aaa" font-size="14">Intelligent load management, peak shaving, and demand response.</text>
  <line x1="290" y1="95" x2="1160" y2="95" stroke="#333" stroke-width="1"/>

  <!-- KPI Cards -->
  <rect x="290" y="110" width="200" height="80" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <text x="310" y="138" fill="#aaa" font-size="12">Current Demand</text>
  <text x="310" y="165" fill="#ffffff" font-size="20" font-weight="bold">2,450 kW</text>
  <text x="310" y="183" fill="#4CAF50" font-size="12">▼ -120 kW</text>

  <rect x="510" y="110" width="200" height="80" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <text x="530" y="138" fill="#aaa" font-size="12">Demand Limit</text>
  <text x="530" y="165" fill="#ffffff" font-size="20" font-weight="bold">3,000 kW</text>

  <rect x="730" y="110" width="200" height="80" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <text x="750" y="138" fill="#aaa" font-size="12">Peak Today</text>
  <text x="750" y="165" fill="#ffffff" font-size="20" font-weight="bold">2,890 kW</text>

  <rect x="950" y="110" width="200" height="80" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <text x="970" y="138" fill="#aaa" font-size="12">Load Factor</text>
  <text x="970" y="165" fill="#ffffff" font-size="20" font-weight="bold">78%</text>
  <text x="970" y="183" fill="#4CAF50" font-size="12">▲ +3%</text>

  <!-- 24-Hour Load Profile Chart -->
  <text x="290" y="225" fill="#ffffff" font-size="16" font-weight="bold">📊 24-Hour Load Profile</text>
  <rect x="290" y="240" width="870" height="250" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <!-- Axes -->
  <line x1="340" y1="265" x2="340" y2="465" stroke="#444" stroke-width="0.5"/>
  <line x1="340" y1="465" x2="1120" y2="465" stroke="#444" stroke-width="0.5"/>
  <!-- Demand limit line -->
  <line x1="340" y1="280" x2="1120" y2="280" stroke="#f44336" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="1125" y="284" fill="#f44336" font-size="9">3000 kW</text>
  <!-- Actual load curve -->
  <polyline points="360,420 400,425 440,430 480,400 520,365 560,335 600,310 640,295 680,290 720,285 760,290 800,300 840,320 880,345 920,365 960,390 1000,410 1040,430 1080,425 1100,420" fill="none" stroke="#ff4b4b" stroke-width="2.5"/>
  <!-- Optimized load curve -->
  <polyline points="360,435 400,438 440,442 480,418 520,388 560,362 600,340 640,328 680,325 720,322 760,328 800,335 840,352 880,372 920,388 960,408 1000,425 1040,440 1080,438 1100,435" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="4"/>
