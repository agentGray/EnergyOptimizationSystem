  <text x="290" y="530" fill="#ffffff" font-size="16" font-weight="bold">💡 Load Shifting</text>
  <rect x="290" y="545" width="420" height="150" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <rect x="300" y="555" width="400" height="25" rx="3" fill="#1a1d24"/>
  <text x="315" y="572" fill="#aaa" font-size="10" font-weight="bold">Asset</text>
  <text x="440" y="572" fill="#aaa" font-size="10" font-weight="bold">Current</text>
  <text x="530" y="572" fill="#aaa" font-size="10" font-weight="bold">Shift To</text>
  <text x="635" y="572" fill="#aaa" font-size="10" font-weight="bold">Savings</text>
  <text x="315" y="600" fill="#ccc" font-size="11">Compressor-02</text>
  <text x="440" y="600" fill="#ccc" font-size="11">85 kW</text>
  <text x="530" y="600" fill="#ccc" font-size="11">22:00-06:00</text>
  <text x="635" y="600" fill="#4CAF50" font-size="11">$45/day</text>
  <text x="315" y="625" fill="#ccc" font-size="11">Pump-04</text>
  <text x="440" y="625" fill="#ccc" font-size="11">45 kW</text>
  <text x="530" y="625" fill="#ccc" font-size="11">23:00-05:00</text>
  <text x="635" y="625" fill="#4CAF50" font-size="11">$22/day</text>
  <text x="315" y="650" fill="#ccc" font-size="11">Chiller-02</text>
  <text x="440" y="650" fill="#ccc" font-size="11">120 kW</text>
  <text x="530" y="650" fill="#ccc" font-size="11">21:00-07:00</text>
  <text x="635" y="650" fill="#4CAF50" font-size="11">$58/day</text>

  <!-- Peak Shaving Table -->
  <text x="740" y="530" fill="#ffffff" font-size="16" font-weight="bold">⚡ Peak Shaving</text>
  <rect x="740" y="545" width="420" height="150" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <rect x="750" y="555" width="400" height="25" rx="3" fill="#1a1d24"/>
  <text x="765" y="572" fill="#aaa" font-size="10" font-weight="bold">Asset</text>
  <text x="880" y="572" fill="#aaa" font-size="10" font-weight="bold">Reduce By</text>
  <text x="980" y="572" fill="#aaa" font-size="10" font-weight="bold">Savings</text>
  <text x="1070" y="572" fill="#aaa" font-size="10" font-weight="bold">Impact</text>
  <text x="765" y="600" fill="#ccc" font-size="11">HVAC-01</text>
  <text x="880" y="600" fill="#ccc" font-size="11">15%</text>
  <text x="980" y="600" fill="#ccc" font-size="11">22 kW</text>
  <text x="1070" y="600" fill="#4CAF50" font-size="11">Low</text>
  <text x="765" y="625" fill="#ccc" font-size="11">HVAC-02</text>
  <text x="880" y="625" fill="#ccc" font-size="11">10%</text>
  <text x="980" y="625" fill="#ccc" font-size="11">18 kW</text>
  <text x="1070" y="625" fill="#4CAF50" font-size="11">Low</text>
  <text x="765" y="650" fill="#ccc" font-size="11">Lighting-A</text>
  <text x="880" y="650" fill="#ccc" font-size="11">30%</text>
  <text x="980" y="650" fill="#ccc" font-size="11">12 kW</text>
  <text x="1070" y="650" fill="#4CAF50" font-size="11">None</text>

  <!-- Demand Response & Savings -->
  <text x="290" y="730" fill="#ffffff" font-size="16" font-weight="bold">⚡ Demand Response Status</text>
  <rect x="290" y="745" width="420" height="130" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <text x="310" y="775" fill="#ccc" font-size="12">Program: Peak Demand Reduction</text>
  <text x="310" y="798" fill="#4CAF50" font-size="12">Status: 🟢 Active</text>
  <text x="310" y="821" fill="#ccc" font-size="12">Target: 200 kW | Achieved: 185 kW (92.5%)</text>
  <text x="310" y="844" fill="#ccc" font-size="12">Event Window: 14:00 - 20:00</text>
  <!-- Progress bar -->
  <rect x="310" y="855" width="380" height="8" rx="4" fill="#333"/>
  <rect x="310" y="855" width="352" height="8" rx="4" fill="#4CAF50"/>

  <text x="740" y="730" fill="#ffffff" font-size="16" font-weight="bold">💰 Savings Summary</text>
  <rect x="740" y="745" width="420" height="130" rx="8" fill="url(#card3)" stroke="#333" stroke-width="1"/>
  <text x="770" y="778" fill="#aaa" font-size="12">Daily Savings</text>
  <text x="770" y="803" fill="#4CAF50" font-size="22" font-weight="bold">$312.50</text>
  <text x="950" y="778" fill="#aaa" font-size="12">Monthly Projected</text>
  <text x="950" y="803" fill="#4CAF50" font-size="22" font-weight="bold">$9,375</text>
  <text x="770" y="840" fill="#aaa" font-size="12">CO₂ Reduced</text>
  <text x="770" y="865" fill="#2196F3" font-size="22" font-weight="bold">156 kg/day</text>
</svg>
