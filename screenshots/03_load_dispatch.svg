  <line x1="530" y1="480" x2="550" y2="480" stroke="#4CAF50" stroke-width="2" stroke-dasharray="4"/>
  <text x="555" y="484" fill="#ccc" font-size="11">Optimized (kW)</text>
  <line x1="680" y1="480" x2="700" y2="480" stroke="#f44336" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="705" y="484" fill="#ccc" font-size="11">Demand Limit</text>
  <!-- X labels -->
  <text x="360" y="478" fill="#888" font-size="9">0</text>
  <text x="520" y="478" fill="#888" font-size="9">6</text>
  <text x="680" y="478" fill="#888" font-size="9">12</text>
  <text x="840" y="478" fill="#888" font-size="9">18</text>
  <text x="1000" y="478" fill="#888" font-size="9">24h</text>

