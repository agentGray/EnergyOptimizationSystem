<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#0e1117"/><stop offset="100%" style="stop-color:#1a1d24"/></linearGradient>
    <linearGradient id="card5" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#262730"/><stop offset="100%" style="stop-color:#1e1f2a"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg5)"/>
  <rect x="0" y="0" width="250" height="900" fill="#262730"/>
  <text x="30" y="45" fill="#ffffff" font-size="20" font-weight="bold">⚡ Energy Platform</text>
  <line x1="15" y1="60" x2="235" y2="60" stroke="#444" stroke-width="1"/>
  <text x="30" y="120" fill="#ccc" font-size="14">🏠 Live Dashboard</text>
  <text x="30" y="150" fill="#ccc" font-size="14">🔍 Anomaly Detection</text>
  <text x="30" y="180" fill="#ccc" font-size="14">⚖️ Load Dispatch</text>
  <text x="30" y="210" fill="#ccc" font-size="14">🏭 Asset Health</text>
  <rect x="15" y="223" width="220" height="32" rx="5" fill="#ff4b4b" opacity="0.2"/>
  <text x="30" y="244" fill="#ff4b4b" font-size="14">🌱 ESG &amp; ISO 50001</text>

  <!-- Title -->
  <text x="290" y="50" fill="#ffffff" font-size="26" font-weight="bold">🌱 ESG &amp; ISO 50001 Reporting</text>
  <text x="290" y="78" fill="#aaa" font-size="14">Sustainability metrics, carbon tracking, and compliance reporting.</text>
  <line x1="290" y1="95" x2="1160" y2="95" stroke="#333" stroke-width="1"/>

  <!-- KPIs -->
  <rect x="290" y="110" width="200" height="80" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="310" y="138" fill="#aaa" font-size="12">CO₂ Emissions</text>
  <text x="310" y="165" fill="#ffffff" font-size="20" font-weight="bold">4,250 kg</text>
  <text x="310" y="183" fill="#4CAF50" font-size="12">▼ -320 kg</text>

  <rect x="510" y="110" width="200" height="80" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="530" y="138" fill="#aaa" font-size="12">Energy Intensity</text>
  <text x="530" y="165" fill="#ffffff" font-size="20" font-weight="bold">0.42 kWh/unit</text>
  <text x="530" y="183" fill="#4CAF50" font-size="12">▼ -0.03</text>

  <rect x="730" y="110" width="200" height="80" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="750" y="138" fill="#aaa" font-size="12">Renewable %</text>
  <text x="750" y="165" fill="#ffffff" font-size="20" font-weight="bold">25%</text>
  <text x="750" y="183" fill="#4CAF50" font-size="12">▲ +3%</text>

  <rect x="950" y="110" width="200" height="80" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="970" y="138" fill="#aaa" font-size="12">ISO 50001 Score</text>
  <text x="970" y="165" fill="#ffffff" font-size="20" font-weight="bold">78.5%</text>
  <text x="970" y="183" fill="#4CAF50" font-size="12">▲ +2.1%</text>

  <!-- Carbon Emissions Trend -->
  <text x="290" y="225" fill="#ffffff" font-size="16" font-weight="bold">📈 Carbon Emissions Trend (Monthly)</text>
  <rect x="290" y="240" width="870" height="200" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="260" x2="340" y2="415" stroke="#444" stroke-width="0.5"/>
  <line x1="340" y1="415" x2="1120" y2="415" stroke="#444" stroke-width="0.5"/>
  <!-- Target line -->
  <line x1="340" y1="310" x2="1120" y2="310" stroke="#FFC107" stroke-width="1" stroke-dasharray="5"/>
  <text x="1125" y="314" fill="#FFC107" font-size="9">Target</text>
  <!-- Emissions declining trend -->
  <polyline points="380,270 440,285 500,290 560,310 620,318 680,325 740,330 800,335 860,340 920,345 980,348 1040,352" fill="none" stroke="#4CAF50" stroke-width="2.5"/>
  <circle cx="380" cy="270" r="4" fill="#4CAF50"/>
  <circle cx="560" cy="310" r="4" fill="#4CAF50"/>
  <circle cx="740" cy="330" r="4" fill="#4CAF50"/>
  <circle cx="920" cy="345" r="4" fill="#4CAF50"/>
  <circle cx="1040" cy="352" r="4" fill="#4CAF50"/>
  <!-- Labels -->
  <text x="370" y="430" fill="#888" font-size="9">Jan</text>
  <text x="490" y="430" fill="#888" font-size="9">Mar</text>
  <text x="610" y="430" fill="#888" font-size="9">May</text>
  <text x="730" y="430" fill="#888" font-size="9">Jul</text>
  <text x="850" y="430" fill="#888" font-size="9">Sep</text>
  <text x="970" y="430" fill="#888" font-size="9">Nov</text>
  <text x="305" y="275" fill="#888" font-size="9">5200</text>
  <text x="305" y="355" fill="#888" font-size="9">4100</text>
  <text x="305" y="315" fill="#888" font-size="9">5000</text>

  <!-- ISO 50001 Compliance -->
  <text x="290" y="480" fill="#ffffff" font-size="16" font-weight="bold">🎯 ISO 50001 Compliance</text>
  <rect x="290" y="495" width="420" height="200" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="310" y="525" fill="#ccc" font-size="11">✅ Energy Policy</text>
  <text x="560" y="525" fill="#4CAF50" font-size="11">100%</text>
  <text x="310" y="550" fill="#ccc" font-size="11">✅ Energy Review</text>
  <text x="560" y="550" fill="#4CAF50" font-size="11">95%</text>
  <text x="310" y="575" fill="#ccc" font-size="11">✅ Energy Baseline</text>
  <text x="560" y="575" fill="#4CAF50" font-size="11">90%</text>
  <text x="310" y="600" fill="#ccc" font-size="11">✅ EnPIs Defined</text>
  <text x="560" y="600" fill="#4CAF50" font-size="11">85%</text>
  <text x="310" y="625" fill="#ccc" font-size="11">⚠️ Action Plans</text>
  <text x="560" y="625" fill="#FFC107" font-size="11">70%</text>
  <text x="310" y="650" fill="#ccc" font-size="11">✅ Monitoring System</text>
  <text x="560" y="650" fill="#4CAF50" font-size="11">95%</text>
  <text x="310" y="675" fill="#ccc" font-size="11">⚠️ Internal Audit</text>
  <text x="560" y="675" fill="#FFC107" font-size="11">60%</text>

  <!-- Year-over-Year -->
  <text x="740" y="480" fill="#ffffff" font-size="16" font-weight="bold">📊 Year-over-Year</text>
  <rect x="740" y="495" width="420" height="200" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="770" y="530" fill="#aaa" font-size="12">Energy Reduction</text>
  <text x="770" y="555" fill="#4CAF50" font-size="20" font-weight="bold">12.3%</text>
  <text x="870" y="555" fill="#888" font-size="11">Target: 15%</text>
  <rect x="770" y="565" width="370" height="8" rx="4" fill="#333"/>
  <rect x="770" y="565" width="303" height="8" rx="4" fill="#4CAF50"/>

  <text x="770" y="600" fill="#aaa" font-size="12">CO₂ Reduction</text>
  <text x="770" y="625" fill="#2196F3" font-size="20" font-weight="bold">18.5%</text>
  <text x="870" y="625" fill="#888" font-size="11">Target: 20%</text>
  <rect x="770" y="635" width="370" height="8" rx="4" fill="#333"/>
  <rect x="770" y="635" width="340" height="8" rx="4" fill="#2196F3"/>

  <text x="770" y="668" fill="#aaa" font-size="12">Cost Savings</text>
  <text x="770" y="693" fill="#FFC107" font-size="20" font-weight="bold">$142,500</text>
  <text x="910" y="693" fill="#888" font-size="11">Target: $150K</text>
  <rect x="770" y="703" width="370" height="8" rx="4" fill="#333"/>
  <rect x="770" y="703" width="351" height="8" rx="4" fill="#FFC107"/>

  <!-- Energy Sources -->
  <text x="290" y="730" fill="#ffffff" font-size="16" font-weight="bold">⚡ Energy Sources</text>
  <rect x="290" y="745" width="870" height="130" rx="8" fill="url(#card5)" stroke="#333" stroke-width="1"/>
  <text x="320" y="780" fill="#ccc" font-size="12">Grid Electricity</text>
  <rect x="480" y="767" width="360" height="18" rx="3" fill="#2196F3"/>
  <text x="850" y="781" fill="#ccc" font-size="11">60%</text>
  <text x="320" y="810" fill="#ccc" font-size="12">Solar PV</text>
  <rect x="480" y="797" width="150" height="18" rx="3" fill="#FFC107"/>
  <text x="640" y="811" fill="#ccc" font-size="11">25%</text>
  <text x="320" y="840" fill="#ccc" font-size="12">Battery Storage</text>
  <rect x="480" y="827" width="60" height="18" rx="3" fill="#4CAF50"/>
  <text x="550" y="841" fill="#ccc" font-size="11">10%</text>
  <text x="320" y="868" fill="#ccc" font-size="12">Natural Gas</text>
  <rect x="480" y="855" width="30" height="18" rx="3" fill="#FF9800"/>
  <text x="520" y="869" fill="#ccc" font-size="11">5%</text>
</svg>
